name: Test
on: push

jobs:
  test-php8:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        prefer: [ "prefer-stable", "prefer-lowest" ]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Composer Install
        run: composer update --${{ matrix.prefer }} --no-interaction --no-progress --no-ansi

      - name: Run tests
        run: make check
